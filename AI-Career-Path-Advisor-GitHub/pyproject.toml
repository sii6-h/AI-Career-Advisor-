[project]
name = "ai-career-path-advisor"
version = "1.0.0"
description = "Multi-agent AI career advisor with ReAct tools, observability, external job search, and PDF semantic RAG."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0.0",
  "ddgs>=9.0.0",
  "pydantic>=2.0.0",
  "requests>=2.31.0",
  "pypdf>=5.0.0",
  "sentence-transformers>=3.0.0",
  "numpy>=1.26.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/career_advisor"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
